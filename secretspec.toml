[project]
name = "meetup_ical_export"
revision = "1.0"

# Wired to a real provider (https://secretspec.dev) — `secretspec check`/
# `secretspec get`/`secretspec set` resolve against the real .env file
# (gitignored). This does NOT change runtime retrieval: app.py / meetup_auth.py
# still read os.environ directly (via .envrc's dotenv_if_exists .env) —
# secretspec is an additional, independent way to read/write the same file,
# not a replacement for how the app reads it.
[providers]
local = "dotenv:.env"

[profiles.default]
MEETUP_EVENT_SOURCE = { description = "Data source: 'graphql' (OAuth2, auto-discovers groups) or 'ics' (no auth, needs MEETUP_GROUP_SLUGS)", default = "graphql", providers = ["local"] }
MEETUP_GROUP_SLUGS = { description = "Comma-separated group slugs (the bit after meetup.com/ in a group URL). Required when MEETUP_EVENT_SOURCE=ics; optional with graphql (skips membership auto-discovery)", required = false, providers = ["local"] }
MEETUP_CLIENT_ID = { description = "OAuth consumer key from https://www.meetup.com/api/oauth/list/ — required for MEETUP_EVENT_SOURCE=graphql", required = false, providers = ["local"] }
MEETUP_CLIENT_SECRET = { description = "OAuth consumer secret from https://www.meetup.com/api/oauth/list/ — required for MEETUP_EVENT_SOURCE=graphql", required = false, providers = ["local"] }
MEETUP_REDIRECT_URI = { description = "Must match (or start with) the redirect URI registered on the OAuth consumer", default = "http://localhost:5000/oauth2/callback", providers = ["local"] }
MEETUP_TOKEN_CACHE = { description = "Path where the OAuth2 access/refresh token pair is persisted (gitignored, mode 0600)", default = ".token_cache.json", providers = ["local"] }
MEETUP_API_URL = { description = "Meetup's GraphQL endpoint — override only for testing", default = "https://api.meetup.com/gql-ext", providers = ["local"] }
OUTPUT_TIMEZONE = { description = "IANA timezone name written to the calendar's X-WR-TIMEZONE", default = "America/New_York", providers = ["local"] }
CACHE_TTL_HOURS = { description = "How long a rendered feed is served before going back to Meetup", default = "24", providers = ["local"] }
FLASK_SECRET_KEY = { description = "Signs the session cookie carrying the OAuth state value. Defaults to a random per-process value if unset — fine for a single-user deployment", required = false, providers = ["local"] }
DEBUG = { description = "Verbose logging, and only query the first group (keeps API usage down)", required = false, providers = ["local"] }
